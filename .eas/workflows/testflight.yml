# Builds the iPhone app and sends it to TestFlight, where staff install it. Run it for changes an update
# can't carry (see docs/DEPLOY.md) and at least every 90 days, when TestFlight builds stop opening. Start it
# from expo.dev, with `npx eas-cli@latest workflow:run .eas/workflows/testflight.yml`, or through the Expo
# connector.
name: iPhone build to TestFlight

jobs:
  build_ios:
    name: Build for iPhone
    type: build
    params:
      platform: ios
      profile: production
  testflight:
    name: Send to TestFlight
    needs: [build_ios]
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
